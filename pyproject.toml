[project]
name = "isodiv"
version = "0.1.0"
description = "Clock-free, dialect-count-robust diversity of language lineages (LDND + Leinster–Meckes maximum diversity)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "rapidfuzz>=3.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["numba>=0.59"]      # compiled alignment kernel, ~50x faster PMI distances

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
